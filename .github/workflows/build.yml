name: Construire l'APK

on:
  push:
    branches: [main, "essai-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Modele Vosk anglais
        run: |
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          curl -sL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip && rm m.zip
          mv vosk-model-small-en-us-0.15 model-en-us
          cat /proc/sys/kernel/random/uuid > model-en-us/uuid

      - name: Tests automatiques (si un test échoue, pas d'APK)
        run: gradle testDebugUnitTest --no-daemon

      - name: Vérification du code (lint)
        run: gradle lintDebug --no-daemon

      - name: Compiler
        run: gradle assembleDebug --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk Doublage-Direct-v${{ github.run_number }}.apk

      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Doublage Direct v${{ github.run_number }}
          files: Doublage-Direct-v${{ github.run_number }}.apk
